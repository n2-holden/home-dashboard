# Stamp / act when driveway alarm triggers (conditions + actions handled in Python).

- id: dashboard_driveway_alarm_triggered
  alias: Driveway alarm triggered
  description: >
    When Shelly Outside Gate I/O Input 0 matches the configured trigger state
    (On or Off), run the dashboard driveway-alarm trigger script. The icon always
    stamps and the reset timer restarts; control-log always runs; open dashboards
    play audio when enabled; conditions only gate trigger actions / email-phone.
  mode: restart
  trigger:
    - platform: state
      entity_id: binary_sensor.outside_gate_i_o_input_0
  condition:
    - condition: state
      entity_id: input_boolean.driveway_alarm_enabled
      state: 'on'
    - condition: template
      value_template: >
        {% set want = states('input_select.dashboard_driveway_alarm_trigger') | lower %}
        {% if want not in ['on', 'off'] %}
          {% set want = 'on' %}
        {% endif %}
        {# Only a real on<->off edge: reconnecting from unavailable is not a trigger. #}
        {{ trigger.to_state is not none
           and trigger.from_state is not none
           and trigger.to_state.state | lower == want
           and trigger.from_state.state | lower in ['on', 'off']
           and trigger.from_state.state | lower != want }}
  action:
    - action: shell_command.dashboard_run_driveway_trigger
