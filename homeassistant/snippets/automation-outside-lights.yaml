# Replace the three outside_lights_* entries in automations.yaml with this file.
- id: outside_lights_none_mode
  alias: Outside lights None mode
  mode: single
  trigger:
    - platform: state
      entity_id: input_select.outside_lights_mode
      to: "None"
  condition:
    - condition: state
      entity_id: input_select.outside_lights_mode
      state: "None"
    - condition: template
      value_template: >-
        {{ trigger.platform != 'state'
           or (trigger.from_state is not none
               and trigger.from_state.state not in ['unknown', 'unavailable']) }}
  action:
    - service: script.outside_lights_all_off

- id: outside_lights_normal_mode
  alias: Outside lights Normal mode
  mode: single
  trigger:
    - platform: state
      entity_id: input_select.outside_lights_mode
      to: "Normal"
      id: mode_selected
    - platform: sun
      event: sunset
      id: sunset
    - platform: sun
      event: sunrise
      id: sunrise
    - platform: time
      at: "22:30:00"
      id: normal_off
  condition:
    - condition: state
      entity_id: input_select.outside_lights_mode
      state: "Normal"
  action:
    - choose:
        - conditions:
            - condition: trigger
              id: sunset
          sequence:
            - service: script.outside_lights_normal_on
        - conditions:
            - condition: trigger
              id: normal_off
          sequence:
            - service: script.outside_lights_normal_late_off
        - conditions:
            - condition: trigger
              id: sunrise
          sequence:
            - service: script.outside_lights_sign_off
        - conditions:
            - condition: trigger
              id: mode_selected
            - condition: template
              value_template: >-
                {{ trigger.from_state is not none
                   and trigger.from_state.state not in ['unknown', 'unavailable'] }}
            - condition: template
              value_template: "{{ now().strftime('%H:%M') < '22:30' }}"
          sequence:
            - service: script.outside_lights_normal_on
      default:
        - service: script.outside_lights_all_off

- id: outside_lights_guest_mode
  alias: Outside lights Guest mode
  mode: single
  trigger:
    - platform: state
      entity_id: input_select.outside_lights_mode
      to: "Guest"
  condition:
    - condition: state
      entity_id: input_select.outside_lights_mode
      state: "Guest"
    - condition: template
      value_template: >-
        {{ trigger.platform != 'state'
           or (trigger.from_state is not none
               and trigger.from_state.state not in ['unknown', 'unavailable']) }}
  action:
    - service: script.outside_lights_guest_on
