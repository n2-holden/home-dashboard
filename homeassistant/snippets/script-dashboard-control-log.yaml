# Merge into scripts.yaml (shell_command keys must exist in configuration.yaml).
# Deploy Ensure-DashboardScriptFromSnippet wires these.

dashboard_log_control:
  alias: Append dashboard control log
  mode: queued
  max: 30
  fields:
    source:
      selector:
        text:
    actor:
      selector:
        text:
    action:
      selector:
        text:
    entity_id:
      selector:
        text:
    ok:
      selector:
        text:
    detail_b64:
      selector:
        text:
  sequence:
    - service: shell_command.dashboard_append_control_log
      data:
        source: "{{ source }}"
        actor: "{{ actor }}"
        action: "{{ action }}"
        entity_id: "{{ entity_id }}"
        ok: "{{ ok }}"
        detail_b64: "{{ detail_b64 }}"

dashboard_clear_control_log:
  alias: Clear dashboard control logs
  mode: single
  sequence:
    - service: shell_command.dashboard_clear_control_log

dashboard_clear_activity_log:
  alias: Clear dashboard activity log
  mode: single
  sequence:
    - service: shell_command.dashboard_clear_activity_log

dashboard_clear_communication_log:
  alias: Clear dashboard communication log
  mode: single
  sequence:
    - service: shell_command.dashboard_clear_communication_log
