# Merge into configuration.yaml under input_number: (or use the packages file).
shed_power_on_soc_threshold:
  name: Shed Power on SOC threshold
  min: 0
  max: 100
  step: 1
  unit_of_measurement: "%"
  mode: box
shed_power_off_soc_threshold:
  name: Shed Power off SOC threshold
  min: 0
  max: 100
  step: 1
  unit_of_measurement: "%"
  mode: box
device_comm_failure_minutes:
  name: Device communication failure minutes
  min: 1
  max: 1440
  step: 1
  unit_of_measurement: "min"
  mode: box
  initial: 15
pool_pump_auto_on_minutes:
  name: Pool pump auto turn-on minutes
  min: 1
  max: 1440
  step: 1
  unit_of_measurement: "min"
  mode: box
  initial: 10
pool_low_water_inches:
  name: Pool low water inches
  min: -50
  max: 50
  step: 0.1
  unit_of_measurement: "in"
  mode: box
  initial: -1
pond_low_water_inches:
  name: Pond low water inches
  min: -50
  max: 50
  step: 0.1
  unit_of_measurement: "in"
  mode: box
  initial: -2
cistern_low_water_percent:
  name: Cistern low water percent
  min: 0
  max: 100
  step: 1
  unit_of_measurement: "%"
  mode: box
  initial: 50
pool_water_level_offset:
  name: Pool water level offset
  min: -100
  max: 200
  step: 0.1
  unit_of_measurement: "in"
  mode: box
  initial: 0
pond_water_level_offset:
  name: Pond water level offset
  min: -100
  max: 200
  step: 0.1
  unit_of_measurement: "in"
  mode: box
  initial: 0
