# Notify when WAN/internet ping stays failed long enough.
# input_boolean.internet_outage_alerted pairs the two automations: outage sets
# it, restored clears it, so every outage alert gets exactly one restored alert
# and a restored alert is never sent without an outage alert.

- id: dashboard_internet_outage
  alias: Notify when internet is down
  description: >
    Sends email and/or phone when binary_sensor.internet stays off for the
    configured minutes, if the alert and channel helpers are on. Local dashboard
    clients still show the outage badge even when cloud notify cannot deliver.
  mode: single
  trigger:
    - platform: state
      entity_id: binary_sensor.internet
      to: "off"
      for:
        minutes: "{{ states('input_number.internet_outage_minutes') | int(2) }}"
  condition:
    - condition: state
      entity_id: input_boolean.internet_outage_alerted
      state: "off"
    - condition: state
      entity_id: input_boolean.internet_outage_email_enabled
      state: "on"
    - condition: or
      conditions:
        - condition: state
          entity_id: input_boolean.dashboard_notify_email_enabled
          state: "on"
        - condition: state
          entity_id: input_boolean.dashboard_notify_phone_enabled
          state: "on"
  action:
    - service: input_boolean.turn_on
      target:
        entity_id: input_boolean.internet_outage_alerted
    - service: script.dashboard_log_control
      data:
        source: automation
        actor: dashboard_internet_outage
        action: notify.alert
        entity_id: binary_sensor.internet
        ok: "1"
        detail_b64: "-"
    - parallel:
        - if:
            - condition: state
              entity_id: input_boolean.dashboard_notify_email_enabled
              state: "on"
          then:
            - service: script.dashboard_notify_email
              data:
                title: Internet outage
                message: >-
                  Home Assistant cannot reach the internet (WAN ping failed for
                  {{ states('input_number.internet_outage_minutes') }} min). Check
                  Xfinity modem / eero gateway.
        - if:
            - condition: state
              entity_id: input_boolean.dashboard_notify_phone_enabled
              state: "on"
          then:
            - service: script.dashboard_notify_phone
              data:
                title: Internet outage
                message: >-
                  Internet ping failed for
                  {{ states('input_number.internet_outage_minutes') }} min.
                  Check Xfinity / eero.

- id: dashboard_internet_restored
  alias: Notify when internet is restored
  description: >
    Sends one recovery notice per outage alert, once binary_sensor.internet has
    been back on for a minute. Also catches a recovery that happened while
    Home Assistant was restarting.
  mode: single
  trigger:
    - platform: state
      entity_id: binary_sensor.internet
      to: "on"
      for:
        minutes: 1
    - platform: homeassistant
      event: start
  condition:
    - condition: state
      entity_id: input_boolean.internet_outage_alerted
      state: "on"
    - condition: state
      entity_id: binary_sensor.internet
      state: "on"
  action:
    - variables:
        # Outage alert fired `internet_outage_minutes` after the connection dropped.
        outage_min: >-
          {{ ((now() - states.input_boolean.internet_outage_alerted.last_changed).total_seconds() / 60
              + (states('input_number.internet_outage_minutes') | int(2)) - 1) | round(0) | int }}
    - service: input_boolean.turn_off
      target:
        entity_id: input_boolean.internet_outage_alerted
    - service: script.dashboard_log_control
      data:
        source: automation
        actor: dashboard_internet_restored
        action: notify.alert
        entity_id: binary_sensor.internet
        ok: "1"
        detail_b64: "-"
    - parallel:
        - if:
            - condition: state
              entity_id: input_boolean.dashboard_notify_email_enabled
              state: "on"
          then:
            - service: script.dashboard_notify_email
              data:
                title: Internet restored
                message: >-
                  Home internet connectivity is back after about {{ outage_min }}
                  min (WAN ping succeeded).
        - if:
            - condition: state
              entity_id: input_boolean.dashboard_notify_phone_enabled
              state: "on"
          then:
            - service: script.dashboard_notify_phone
              data:
                title: Internet restored
                message: Home internet connectivity is back after about {{ outage_min }} min.
