# Ball fountain fill controller: same logic as the pond fill controller
# (automation-pond-fill-auto.yaml) for the YoLink "Ball Fountain" depth sensor and the
# Tuya "Ball fountain filler" valve.
#
# The last five readings (every sensor change plus a once-a-minute sample) are kept in
# input_text.ball_fountain_level_samples. The fill only opens when all five agree
# within 0.45 in and are below the low setpoint; closing and progress checks use the
# median. Run state lives in input_text.ball_fountain_fill_run as
# "started|window_start|window_level|last_open". A fill runs at least 5 minutes, must
# raise the level 0.3 in per 15 minutes and may run at most 4 hours; otherwise the
# valve closes and input_boolean.ball_fountain_fill_error pauses auto fill until it is
# cleared on the dashboard. The valve's own 10-minute shutoff is handled by reopening
# it. Fills started by hand are left alone.

- id: ball_fountain_fill_controller
  alias: Ball fountain fill controller
  description: >-
    Samples the adjusted Ball fountain level and opens/closes the Ball fountain filler
    valve from stable readings; errors out (valve closed) when filling doesn't raise
    the level and notifies when the water is turned off during a fill.
  mode: queued
  max: 10
  max_exceeded: silent
  trigger:
    - platform: time_pattern
      minutes: "/1"
    - platform: state
      entity_id: sensor.ball_fountain_distance
  variables:
    valve: valve.valve_controller_2_valve
    min_run_minutes: 5
    window_minutes: 15
    min_rise_inches: 0.3
    max_run_hours: 4
    tolerance_inches: 0.45
    valve_timer_min: 9
    valve_timer_max: 11
  action:
    - variables:
        reading: >-
          {%- set raw = states('sensor.ball_fountain_distance') | float(none) -%}
          {%- if raw is none -%}x{%- else -%}
          {%- set unit = state_attr('sensor.ball_fountain_distance', 'unit_of_measurement')
             | default('ft', true) | lower -%}
          {%- if unit in ['in', 'inch', 'inches'] -%}{%- set inches = raw -%}
          {%- elif unit in ['m', 'meter', 'meters'] -%}{%- set inches = raw * 39.3701 -%}
          {%- elif unit in ['cm', 'centimeter', 'centimeters'] -%}{%- set inches = raw / 2.54 -%}
          {%- else -%}{%- set inches = raw * 12 -%}{%- endif -%}
          {{- (inches - states('input_number.ball_fountain_water_level_offset') | float(0)) | round(2) -}}
          {%- endif -%}
    - service: input_text.set_value
      target:
        entity_id: input_text.ball_fountain_level_samples
      data:
        value: >-
          {%- set prev = states('input_text.ball_fountain_level_samples') -%}
          {%- set items = [] if prev in ['', 'unknown', 'unavailable'] else prev.split(',') -%}
          {{- (items[-4:] + [reading | string]) | join(',') -}}
    - variables:
        samples: "{{ states('input_text.ball_fountain_level_samples').split(',') }}"
        nums: >-
          {{ states('input_text.ball_fountain_level_samples').split(',')
             | map('float', none) | reject('none') | list }}
        stable: >-
          {{ samples | count == 5 and nums | count == 5
             and (nums | max) - (nums | min) <= tolerance_inches }}
        median: >-
          {%- set s = nums | sort -%}
          {{- s[(s | count) // 2] if s | count >= 3 else none -}}
        low: "{{ states('input_number.ball_fountain_fill_low_inches') | float(-1) }}"
        full: "{{ states('input_number.ball_fountain_fill_full_inches') | float(0) }}"
        run_parts: "{{ states('input_text.ball_fountain_fill_run').split('|') }}"
        running: "{{ run_parts | count >= 3 }}"
        now_ts: "{{ as_timestamp(now()) }}"
        started_ts: "{{ run_parts[0] | float(0) if running else 0 }}"
        open_ts: >-
          {{ (run_parts[3] if run_parts | count >= 4 else run_parts[0]) | float(0)
             if running else 0 }}
        elapsed_min: "{{ ((now_ts - started_ts) / 60) if running else 0 }}"
        window_min: "{{ ((now_ts - run_parts[1] | float(0)) / 60) if running else 0 }}"
        window_level: "{{ run_parts[2] | float(none) if running else none }}"
        since_open_min: "{{ ((now_ts - open_ts) / 60) if running else 0 }}"
        valve_state: "{{ states(valve) }}"
        valve_changed_ts: >-
          {{ as_timestamp(states.valve.valve_controller_2_valve.last_changed, 0)
             if states.valve.valve_controller_2_valve is not none else 0 }}
        open_minutes: "{{ (valve_changed_ts - open_ts) / 60 }}"
        valve_closed: "{{ valve_state in ['closed', 'closing'] }}"
        closed_after_open: "{{ valve_closed and valve_changed_ts > open_ts }}"
        timer_close: >-
          {{ closed_after_open and valve_timer_min <= open_minutes <= valve_timer_max }}
    - choose:
        # Automatic fill turned off mid-run: close and stop.
        - conditions:
            - "{{ running and is_state('input_boolean.ball_fountain_fill_auto_enabled', 'off') }}"
          sequence:
            - service: valve.close_valve
              target:
                entity_id: "{{ valve }}"
              continue_on_error: true
            - service: input_text.set_value
              target:
                entity_id: input_text.ball_fountain_fill_run
              data:
                value: ""
            - service: script.dashboard_log_control
              data:
                source: automation
                actor: ball_fountain_fill_controller
                action: valve.close_valve
                entity_id: "{{ valve }}"
                ok: "1"
                detail_b64: "{{ 'Automatic Ball fountain fill was turned off' | base64_encode }}"

        # Full after the minimum run time.
        - conditions:
            - >-
              {{ running and elapsed_min >= min_run_minutes
                 and median is not none and median >= full }}
          sequence:
            - service: valve.close_valve
              target:
                entity_id: "{{ valve }}"
            - service: input_text.set_value
              target:
                entity_id: input_text.ball_fountain_fill_run
              data:
                value: ""
            - service: script.dashboard_log_control
              data:
                source: automation
                actor: ball_fountain_fill_controller
                action: valve.close_valve
                entity_id: "{{ valve }}"
                ok: "1"
                detail_b64: >-
                  {{ ('Ball fountain full at ' ~ median ~ ' in (close above ' ~ full
                      ~ ' in) after ' ~ (elapsed_min | round(0) | int) ~ ' min') | base64_encode }}

        # Valve won't open or went unavailable, no rise over the last window, or the
        # run took too long: error out.
        - conditions:
            - >-
              {{ running and (
                   (since_open_min >= 2 and valve_state in ['unavailable', 'unknown'])
                   or (since_open_min >= 2 and valve_closed and valve_changed_ts <= open_ts)
                   or elapsed_min >= max_run_hours * 60
                   or (window_min >= window_minutes
                       and (median is none or window_level is none
                            or median - window_level < min_rise_inches))) }}
          sequence:
            - variables:
                reason: >-
                  {%- if since_open_min >= 2 and valve_state in ['unavailable', 'unknown'] -%}
                  The Ball fountain filler valve went {{ valve_state }} during a fill.
                  {%- elif since_open_min >= 2 and valve_closed and valve_changed_ts <= open_ts -%}
                  The Ball fountain filler valve didn't open when the automation turned it on.
                  {%- elif elapsed_min >= max_run_hours * 60 -%}
                  Ball fountain fill ran {{ max_run_hours }} hours without reaching the full
                  level ({{ median }} in, close above {{ full }} in).
                  {%- elif median is none -%}
                  Ball fountain fill ran {{ window_minutes }} minutes without a usable level
                  reading.
                  {%- else -%}
                  Ball fountain level didn't rise during {{ window_minutes }} minutes of filling
                  ({{ window_level }} in to {{ median }} in). Check that the water supply to the
                  filler valve is on.
                  {%- endif %} The Ball fountain filler valve was closed and automatic fill is
                  paused until the error is cleared on the dashboard.
            - service: valve.close_valve
              target:
                entity_id: "{{ valve }}"
              continue_on_error: true
            - service: input_boolean.turn_on
              target:
                entity_id: input_boolean.ball_fountain_fill_error
            - service: input_text.set_value
              target:
                entity_id: input_text.ball_fountain_fill_run
              data:
                value: ""
            - service: script.dashboard_log_control
              data:
                source: automation
                actor: ball_fountain_fill_controller
                action: ball_fountain_fill.error
                entity_id: "{{ valve }}"
                ok: "0"
                detail_b64: "{{ reason | base64_encode }}"
            - if:
                - condition: state
                  entity_id: input_boolean.dashboard_notify_email_enabled
                  state: "on"
              then:
                - service: script.dashboard_notify_email
                  data:
                    title: Ball fountain fill error
                    message: "{{ reason }}"
                  continue_on_error: true
            - if:
                - condition: state
                  entity_id: input_boolean.dashboard_notify_phone_enabled
                  state: "on"
              then:
                - service: script.dashboard_notify_phone
                  data:
                    title: Ball fountain fill error
                    message: "{{ reason }}"
                  continue_on_error: true

        # The valve's own 10-minute timer closed it: reopen and keep the same fill.
        - conditions:
            - "{{ running and timer_close }}"
          sequence:
            - service: valve.open_valve
              target:
                entity_id: "{{ valve }}"
            - service: input_text.set_value
              target:
                entity_id: input_text.ball_fountain_fill_run
              data:
                value: "{{ run_parts[0] }}|{{ run_parts[1] }}|{{ run_parts[2] }}|{{ now_ts | int }}"
            - service: script.dashboard_log_control
              data:
                source: automation
                actor: ball_fountain_fill_controller
                action: valve.open_valve
                entity_id: "{{ valve }}"
                ok: "1"
                detail_b64: >-
                  {{ ('Reopened after the valve timer closed it ('
                      ~ (elapsed_min | round(0) | int) ~ ' min into the fill, level '
                      ~ median ~ ' in)') | base64_encode }}

        # Water turned off outside the automation mid-fill: stop tracking and notify.
        - conditions:
            - "{{ running and closed_after_open and since_open_min >= 1 }}"
          sequence:
            - variables:
                reason: >-
                  The Ball fountain filler valve was turned off during an automatic fill,
                  {{ open_minutes | round(0) | int }} minutes after it opened (level
                  {{ median }} in, fill below {{ low }} in). The automation stopped this fill
                  and will start a new one if the level stays low.
            - service: input_text.set_value
              target:
                entity_id: input_text.ball_fountain_fill_run
              data:
                value: ""
            - service: script.dashboard_log_control
              data:
                source: automation
                actor: ball_fountain_fill_controller
                action: ball_fountain_fill.stopped
                entity_id: "{{ valve }}"
                ok: "0"
                detail_b64: "{{ reason | base64_encode }}"
            - if:
                - condition: state
                  entity_id: input_boolean.dashboard_notify_email_enabled
                  state: "on"
              then:
                - service: script.dashboard_notify_email
                  data:
                    title: Ball fountain fill turned off
                    message: "{{ reason }}"
                  continue_on_error: true
            - if:
                - condition: state
                  entity_id: input_boolean.dashboard_notify_phone_enabled
                  state: "on"
              then:
                - service: script.dashboard_notify_phone
                  data:
                    title: Ball fountain fill turned off
                    message: "{{ reason }}"
                  continue_on_error: true

        # Filling and the level rose: start the next window.
        - conditions:
            - "{{ running and window_min >= window_minutes }}"
          sequence:
            - service: input_text.set_value
              target:
                entity_id: input_text.ball_fountain_fill_run
              data:
                value: "{{ run_parts[0] }}|{{ now_ts | int }}|{{ median }}|{{ open_ts | int }}"

        # Five matching low readings: open the valve.
        - conditions:
            - "{{ not running and stable and (nums | max) < low }}"
            - condition: state
              entity_id: input_boolean.ball_fountain_fill_auto_enabled
              state: "on"
            - condition: state
              entity_id: input_boolean.ball_fountain_fill_error
              state: "off"
            - "{{ valve_state == 'closed' }}"
          sequence:
            - service: valve.open_valve
              target:
                entity_id: "{{ valve }}"
            - service: input_text.set_value
              target:
                entity_id: input_text.ball_fountain_fill_run
              data:
                value: "{{ now_ts | int }}|{{ now_ts | int }}|{{ median }}|{{ now_ts | int }}"
            - service: script.dashboard_log_control
              data:
                source: automation
                actor: ball_fountain_fill_controller
                action: valve.open_valve
                entity_id: "{{ valve }}"
                ok: "1"
                detail_b64: >-
                  {{ ('Ball fountain level ' ~ median ~ ' in below ' ~ low
                      ~ ' in (last 5 readings: ' ~ samples | join(', ') ~ ')') | base64_encode }}
