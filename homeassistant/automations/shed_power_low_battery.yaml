# Turns on switch.shed_power when SOC crosses below the on threshold and turns
# it off when SOC crosses above the off threshold. Commands are sent only on
# those threshold crossings — not on a timer or while SOC stays out of range.
# The input_number helpers are shared by all dashboard instances and survive
# dashboard deploys.
# Runs on Home Assistant itself — no dashboard clients required.
- id: shed_power_initialize_thresholds
  alias: Initialize Shed Power thresholds
  mode: single
  trigger:
    - platform: homeassistant
      event: start
  condition:
    - condition: state
      entity_id: input_boolean.shed_power_thresholds_initialized
      state: "off"
  action:
    - service: input_number.set_value
      target:
        entity_id: input_number.shed_power_on_soc_threshold
      data:
        value: 20
    - service: input_number.set_value
      target:
        entity_id: input_number.shed_power_off_soc_threshold
      data:
        value: 80
    - service: input_boolean.turn_on
      target:
        entity_id: input_boolean.shed_power_thresholds_initialized

- id: shed_power_on_low_battery
  alias: Shed Power turn on when SOC falls below threshold
  description: >-
    Turn on switch.shed_power only when battery SOC crosses downward through
    the configured on threshold. Does not re-assert while SOC stays below.
  mode: single
  trigger:
    - platform: state
      entity_id: sensor.enphase_powerpack_5904582_battery_soc
  condition:
    - condition: template
      value_template: >-
        {% set soc = trigger.to_state.state | float(none) %}
        {% set prev = trigger.from_state.state | float(none) %}
        {% set threshold = states('input_number.shed_power_on_soc_threshold') | float(none) %}
        {{ soc is not none and prev is not none and threshold is not none
           and prev >= threshold and soc < threshold }}
  action:
    - service: switch.turn_on
      target:
        entity_id: switch.shed_power

- id: shed_power_off_high_battery
  alias: Shed Power turn off when SOC rises above threshold
  description: >-
    Turn off switch.shed_power only when battery SOC crosses upward through
    the configured off threshold. Does not re-assert while SOC stays above.
  mode: single
  trigger:
    - platform: state
      entity_id: sensor.enphase_powerpack_5904582_battery_soc
  condition:
    - condition: template
      value_template: >-
        {% set soc = trigger.to_state.state | float(none) %}
        {% set prev = trigger.from_state.state | float(none) %}
        {% set threshold = states('input_number.shed_power_off_soc_threshold') | float(none) %}
        {{ soc is not none and prev is not none and threshold is not none
           and prev <= threshold and soc > threshold }}
  action:
    - service: switch.turn_off
      target:
        entity_id: switch.shed_power

- id: dashboard_persist_map_offset
  alias: Dashboard persist pool/pond map offset
  mode: parallel
  max_exceeded: silent
  trigger:
    - platform: event
      event_type: dashboard_update_map_offset
  action:
    - service: shell_command.dashboard_update_map_offset
      data:
        kind: "{{ trigger.event.data.kind }}"
        offset: "{{ trigger.event.data.offset }}"
