# Shed Power grid automation (live HA pattern).
# Turns switch.shed_power on/off from SOC thresholds, and forces off while
# shed PV production is above zero.
- id: shed_power_initialize_thresholds
  alias: Initialize Shed Power thresholds
  mode: single
  trigger:
    - platform: homeassistant
      event: start
  condition:
    - condition: state
      entity_id: input_boolean.shed_power_thresholds_initialized
      state: "off"
  action:
    - service: input_number.set_value
      target:
        entity_id: input_number.shed_power_on_soc_threshold
      data:
        value: 20
    - service: input_number.set_value
      target:
        entity_id: input_number.shed_power_off_soc_threshold
      data:
        value: 80
    - service: input_boolean.turn_on
      target:
        entity_id: input_boolean.shed_power_thresholds_initialized

- id: shed_power_on_low_battery
  alias: Shed Power automatic grid control
  description: >-
    Turns switch.shed_power on when SOC is below the on threshold and the shed
    is not producing PV. Turns it off when SOC is above the off threshold, or
    whenever shed PV production is above zero.
  mode: single
  trigger:
    - platform: state
      entity_id: sensor.enphase_powerpack_5904582_battery_soc
    - platform: state
      entity_id: sensor.enphase_powerpack_5904582_pv_production_power
    - platform: homeassistant
      event: start
    - platform: time_pattern
      minutes: "/5"
  action:
    - choose:
        - conditions:
            - condition: state
              entity_id: switch.shed_power
              state: "on"
            - condition: template
              value_template: >-
                {{ is_number(states('sensor.enphase_powerpack_5904582_pv_production_power'))
                   and states('sensor.enphase_powerpack_5904582_pv_production_power')|float > 0 }}
          sequence:
            - service: switch.turn_off
              target:
                entity_id: switch.shed_power
        - conditions:
            - condition: state
              entity_id: switch.shed_power
              state: "off"
            - condition: template
              value_template: >-
                {{ is_number(states('sensor.enphase_powerpack_5904582_battery_soc'))
                   and is_number(states('input_number.shed_power_on_soc_threshold'))
                   and states('sensor.enphase_powerpack_5904582_battery_soc')|float
                   < states('input_number.shed_power_on_soc_threshold')|float
                   and (not is_number(states('sensor.enphase_powerpack_5904582_pv_production_power'))
                        or states('sensor.enphase_powerpack_5904582_pv_production_power')|float <= 0) }}
          sequence:
            - service: switch.turn_on
              target:
                entity_id: switch.shed_power
        - conditions:
            - condition: state
              entity_id: switch.shed_power
              state: "on"
            - condition: template
              value_template: >-
                {{ is_number(states('sensor.enphase_powerpack_5904582_battery_soc'))
                   and is_number(states('input_number.shed_power_off_soc_threshold'))
                   and states('sensor.enphase_powerpack_5904582_battery_soc')|float
                   > states('input_number.shed_power_off_soc_threshold')|float }}
          sequence:
            - service: switch.turn_off
              target:
                entity_id: switch.shed_power

- id: dashboard_persist_map_offset
  alias: Dashboard persist pool/pond map offset
  mode: parallel
  max_exceeded: silent
  trigger:
    - platform: event
      event_type: dashboard_update_map_offset
  action:
    - service: shell_command.dashboard_update_map_offset
      data:
        kind: "{{ trigger.event.data.kind }}"
        offset: "{{ trigger.event.data.offset }}"

