# Turns on switch.shed_power whenever PowerPack SOC is below 20%.
# Runs on Home Assistant itself — no dashboard clients required.
- id: shed_power_on_low_battery
  alias: Shed Power on when battery below 20%
  description: >-
    Turn on the Shed Power Kasa plug when Enphase PowerPack battery SOC
    falls below 20%. Also re-checks on HA start and every 5 minutes so it
    still acts if SOC is already low.
  mode: single
  trigger:
    - platform: numeric_state
      entity_id: sensor.enphase_powerpack_5904582_battery_soc
      below: 20
    - platform: homeassistant
      event: start
    - platform: time_pattern
      minutes: "/5"
  condition:
    - condition: numeric_state
      entity_id: sensor.enphase_powerpack_5904582_battery_soc
      below: 20
    - condition: state
      entity_id: switch.shed_power
      state: "off"
  action:
    - service: switch.turn_on
      target:
        entity_id: switch.shed_power
